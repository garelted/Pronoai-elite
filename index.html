<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>PRONOIA V53 - LOGO ED.</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');
        .font-ultra { font-family: 'Inter', sans-serif; font-weight: 900; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .tab-active { color: #ea580c; border-bottom: 4px solid #ea580c; }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-900 pb-24 italic font-ultra">

    <div id="auth-screen" class="fixed inset-0 flex flex-col items-center justify-center p-10 text-center bg-[#0f172a] z-[100]">
        <h1 class="text-5xl text-white mb-2 uppercase tracking-tighter italic"><span class="text-orange-600">PRONO</span>IA</h1>
        <p class="text-slate-500 uppercase tracking-widest text-[10px] mb-8 italic">Logo Édition V53</p>
        <input type="password" id="pin-input" placeholder="CODE" maxlength="4" class="bg-white/10 border-2 border-orange-600 text-white text-4xl text-center py-5 rounded-[2rem] w-full max-w-[200px] mb-8 focus:outline-none">
        <button onclick="checkAccess()" class="bg-orange-600 text-white px-10 py-4 rounded-3xl uppercase tracking-widest active:scale-95 transition">Analyser</button>
    </div>

    <div id="app-content" class="hidden">
        <nav class="sticky top-0 z-50 bg-white border-b p-6 pt-10 text-center">
            <h1 class="text-4xl tracking-tighter uppercase mb-6 italic"><span class="text-orange-600">PRONO</span>IA</h1>
            <div class="flex justify-between items-center overflow-x-auto gap-5 no-scrollbar px-2">
                <button onclick="switchTab('top')" id="btn-top" class="text-[11px] uppercase pb-1 shrink-0 tab-active font-black">CONSENSUS ⭐</button>
                <button onclick="switchTab('foot')" id="btn-foot" class="text-[11px] uppercase text-slate-400 pb-1 shrink-0 font-black">FOOTBALL ⚽</button>
                <button onclick="switchTab('bsk')" id="btn-bsk" class="text-[11px] uppercase text-slate-400 pb-1 shrink-0 font-black">BASKET 🏀</button>
                <button onclick="switchTab('rugby')" id="btn-rugby" class="text-[11px] uppercase text-slate-400 pb-1 shrink-0 font-black">RUGBY 🏉</button>
            </div>
        </nav>
        <main id="container" class="p-5 space-y-6 max-w-md mx-auto"></main>
    </div>

    <script>
        const PIN_SECURE = "2026";
        const KEY = "95fcd62b93b4971e01d8684207eb1eba";
        const today = new Date().toISOString().split('T')[0];
        const ELITE_LEAGUES = [61, 39, 140, 78, 135, 12, 13, 16, 15, 1, 2, 3]; 

        let DATA = { foot: [], rugby: [], bsk: [] };
        let current = 'top';

        function checkAccess() {
            if(document.getElementById('pin-input').value === PIN_SECURE) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                init();
            }
        }

        function switchTab(t) {
            current = t;
            ['top','foot','rugby','bsk'].forEach(id => {
                const btn = document.getElementById('btn-'+id);
                if(btn) btn.className = id === t ? "text-[11px] uppercase pb-1 shrink-0 tab-active font-black" : "text-[11px] uppercase text-slate-400 pb-1 shrink-0 font-black";
            });
            render();
        }

        // --- MOTEUR DE CALCUL STABLE ---
        function getStablePrediction(m, sport) {
            const id = parseInt(m.fixture?.id || m.id || 100);
            const base = 40 + (id % 25);
            const pDom = base > 70 ? 68 : base;
            const pExt = 95 - pDom - (sport === 'FOOT' ? 15 : 0);
            const pNul = (sport === 'FOOT') ? 100 - pDom - pExt : 0;
            const overProb = 55 + (id % 20);
            const labelOU = sport === 'BSK' ? '212.5 PTS' : '2.5 BUTS';
            const trust = Math.max(pDom, pExt) + 12;

            return {
                pDom: Math.floor(pDom),
                pNul: Math.floor(pNul),
                pExt: Math.floor(pExt),
                trust: Math.min(trust, 98),
                overProb: Math.floor(overProb),
                labelOU: labelOU,
                advice: pDom > pExt ? 'VICTOIRE DOMICILE' : 'VICTOIRE EXTÉRIEURE'
            };
        }

        function renderCard(m, sport) {
            const res = getStablePrediction(m, sport);

            // --- RÉCUPÉRATION DES LOGOS ---
            const homeLogo = m.teams.home.logo;
            const awayLogo = m.teams.away.logo;

            return `
            <div class="bg-white rounded-[2.5rem] shadow-2xl mb-8 overflow-hidden border border-slate-50 relative">
                <div class="px-8 pt-8 pb-2 flex justify-between items-center">
                    <p class="text-[10px] text-slate-400 uppercase tracking-widest">${m.league?.name || 'LIGUE ELITE'}</p>
                    <span class="text-orange-500 text-[9px] font-black">LIVE DATA</span>
                </div>
                
                <div class="px-8 py-4 space-y-3">
                    <div class="flex items-center gap-3">
                        <img src="${homeLogo}" alt="${m.teams.home.name}" class="w-10 h-10 rounded-full border border-slate-100 shadow-sm">
                        <h2 class="text-3xl text-slate-900 uppercase tracking-tighter leading-[0.8] font-black flex-1">${m.teams.home.name}</h2>
                    </div>
                    <div class="flex items-center gap-3">
                        <img src="${awayLogo}" alt="${m.teams.away.name}" class="w-10 h-10 rounded-full border border-slate-100 shadow-sm">
                        <h3 class="text-2xl text-slate-300 uppercase tracking-tighter leading-[1.2] font-black flex-1">${m.teams.away.name}</h3>
                    </div>
                </div>

                <div class="mx-6 my-4 bg-slate-50 rounded-[2rem] p-6 flex justify-around items-center border border-slate-100">
                    <div class="text-center"><p class="text-[9px] text-slate-400 uppercase mb-1 italic font-black">Dom.</p><p class="text-2xl font-black">${res.pDom}%</p></div>
                    ${res.pNul > 0 ? `<div class="h-8 w-[1px] bg-slate-200"></div><div class="text-center"><p class="text-[9px] text-slate-400 uppercase mb-1 italic font-black">Nul</p><p class="text-2xl text-slate-300 font-black">${res.pNul}%</p></div>` : ''}
                    <div class="h-8 w-[1px] bg-slate-200"></div>
                    <div class="text-center"><p class="text-[9px] text-slate-400 uppercase mb-1 italic font-black">Ext.</p><p class="text-2xl font-black">${res.pExt}%</p></div>
                </div>

                <div class="mx-8 mb-6 py-5 px-6 bg-orange-600 rounded-[1.8rem] text-white flex justify-between items-center shadow-lg shadow-orange-200">
                    <div>
                        <p class="text-[9px] uppercase tracking-widest opacity-80 mb-1 font-black">Indice de Score</p>
                        <p class="text-lg uppercase leading-none italic font-black">UNDER ${res.labelOU}</p>
                    </div>
                    <p class="text-2xl font-black italic">${res.overProb}%</p>
                </div>

                <div class="px-8 mb-8">
                    <div class="flex justify-between text-[10px] uppercase mb-2 tracking-widest text-slate-400 italic font-black">
                        <span>Risque Modéré</span>
                        <span>Confiance : ${res.trust}%</span>
                    </div>
                    <div class="h-3.5 w-full bg-slate-100 rounded-full relative overflow-hidden">
                        <div class="h-full bg-gradient-to-r from-orange-500 to-emerald-500" style="width: ${res.trust}%"></div>
                        <div class="absolute top-0 bottom-0 w-[2px] bg-black/30 left-1/2"></div>
                    </div>
                </div>

                <div class="bg-slate-900 p-7 flex justify-between items-center">
                    <div class="text-left">
                        <p class="text-emerald-400 text-[10px] uppercase tracking-widest mb-1 italic font-black">Conseil Expert</p>
                        <p class="text-white text-xl uppercase tracking-tighter italic font-black">${res.advice}</p>
                    </div>
                    <button class="bg-white text-slate-900 text-[10px] px-6 py-4 rounded-2xl uppercase font-black active:scale-95 transition">Détails</button>
                </div>
            </div>`;
        }

        function render() {
            const container = document.getElementById('container');
            container.innerHTML = "";
            let sportKey = current === 'top' ? 'foot' : current;
            let list = (current === 'top') ? [...DATA.foot.slice(0,5), ...DATA.bsk.slice(0,3)] : DATA[current];
            
            const grouped = list.reduce((acc, m) => {
                const l = m.league?.name || "ELITE";
                if (!acc[l]) acc[l] = [];
                acc[l].push(m);
                return acc;
            }, {});

            for (const l in grouped) {
                container.innerHTML += `<div class="mt-8 mb-4 px-4 border-l-4 border-orange-600 ml-2 italic font-black text-[12px] text-slate-500 uppercase tracking-widest">${l}</div>`;
                grouped[l].forEach(m => container.innerHTML += renderCard(m, sportKey.toUpperCase()));
            }
        }

        async function fetchSport(id, host, endpoint) {
            try {
                const res = await fetch(`https://${host}/${endpoint}`, { headers: { "x-rapidapi-key": KEY, "x-rapidapi-host": host } });
                const d = await res.json();
                DATA[id] = (d.response || []).filter(m => ELITE_LEAGUES.includes(m.league?.id));
            } catch (e) { console.log(id + " Error"); }
        }

        async function init() {
            await Promise.all([
                fetchSport('foot', "v3.football.api-sports.io", `fixtures?date=${today}&status=NS`),
                fetchSport('bsk', "v1.basketball.api-sports.io", `games?date=${today}`),
                fetchSport('rugby', "v1.rugby.api-sports.io", `games?date=${today}`)
            ]);
            render();
        }
    </script>
</body>
</html>
