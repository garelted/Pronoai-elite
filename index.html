<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>PRONOIA ELITE V37</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');
        .font-ultra { font-family: 'Inter', sans-serif; font-weight: 900; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .premium-shadow { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15); }
        .refresh-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        #auth-screen { background: #0f172a; z-index: 9999; }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-900 pb-20 italic text-center">

    <div id="auth-screen" class="fixed inset-0 flex flex-col items-center justify-center p-10 text-center">
        <h1 class="text-4xl font-ultra italic text-white mb-1 uppercase tracking-tighter">
            <span class="text-orange-600">PRONO</span>IA ELITE
        </h1>
        <p class="text-slate-400 font-bold uppercase tracking-[0.2em] text-[10px] mb-8 italic">Prono pour les copains</p>
        
        <input type="password" id="pin-input" placeholder="CODE PIN" maxlength="4" class="bg-white/10 border-2 border-orange-600 text-white text-3xl font-ultra text-center py-4 rounded-3xl w-full max-w-[200px] mb-6 focus:outline-none">
        <button onclick="checkAccess()" class="bg-orange-600 text-white font-ultra px-10 py-4 rounded-3xl uppercase tracking-widest active:scale-95 transition-transform">Accéder</button>
        <p id="error-msg" class="text-red-500 mt-4 font-bold hidden uppercase text-[10px]">Code Incorrect</p>
    </div>

    <div id="app-content" class="hidden">
        <nav class="sticky top-0 z-50 bg-white border-b border-slate-100 p-5 pt-8">
            <div class="absolute right-5 top-8">
                <button onclick="init()" id="refresh-btn" class="text-slate-300 hover:text-orange-500 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>
                </button>
            </div>
            <h1 class="text-4xl font-ultra italic tracking-tighter uppercase mb-1"><span class="text-orange-600">PRONO</span>IA</h1>
            <div id="counter" class="text-[10px] font-bold text-slate-300 uppercase tracking-[0.2em] mb-6 italic">Système Elite V37</div>
            <div class="flex justify-between items-center overflow-x-auto gap-5 no-scrollbar px-2 border-b border-slate-100 pb-2">
                <button onclick="switchTab('top')" id="btn-top" class="text-[10px] font-ultra uppercase text-orange-600 border-b-4 border-orange-600 pb-1 shrink-0">TOP CONF ⭐</button>
                <button onclick="switchTab('foot')" id="btn-foot" class="text-[10px] font-ultra uppercase text-slate-400 pb-1 shrink-0">FOOT ⚽</button>
                <button onclick="switchTab('rugby')" id="btn-rugby" class="text-[10px] font-ultra uppercase text-slate-400 pb-1 shrink-0">RUGBY 🏉</button>
                <button onclick="switchTab('bsk')" id="btn-bsk" class="text-[10px] font-ultra uppercase text-slate-400 pb-1 shrink-0">BASKET 🏀</button>
                <button onclick="switchTab('ten')" id="btn-ten" class="text-[10px] font-ultra uppercase text-slate-400 pb-1 shrink-0">TENNIS 🎾</button>
            </div>
        </nav>
        <main id="container" class="p-5 space-y-8 max-w-md mx-auto"></main>
    </div>

    <script>
        const PIN_SECURE = "2026";
        const KEY = "95fcd62b93b4971e01d8684207eb1eba";
        const today = new Date().toISOString().split('T')[0];
        const LEAGUES = {
            foot: [1, 2, 3, 4, 5, 61, 62, 39, 135, 78, 140, 144],
            bsk: [1, 2, 4, 120, 117, 115, 109],
            rugby: [1, 16, 17, 15, 14, 3, 2]
        };
        let DATA = { foot: [], rugby: [], ten: [], bsk: [] };
        let current = 'top';

        function checkAccess() {
            if(document.getElementById('pin-input').value === PIN_SECURE) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                init();
            } else { document.getElementById('error-msg').classList.remove('hidden'); }
        }

        function switchTab(t) {
            current = t;
            ['top','foot','rugby','bsk','ten'].forEach(id => {
                const btn = document.getElementById('btn-'+id);
                if(btn) btn.className = id === t ? "text-[10px] font-ultra uppercase text-orange-600 border-b-4 border-orange-600 pb-1 shrink-0" : "text-[10px] font-ultra uppercase text-slate-400 pb-1 shrink-0";
            });
            render();
        }

        async function fetchSport(id, host, url) {
            try {
                const res = await fetch(url, { headers: { "x-rapidapi-key": KEY, "x-rapidapi-host": host } });
                const d = await res.json();
                let resp = d.response || [];
                if (LEAGUES[id]) resp = resp.filter(m => LEAGUES[id].includes(m.league.id));
                DATA[id] = resp.map(m => ({...m, sportType: id.toUpperCase()}));
                render();
            } catch (e) { console.error(e); }
        }

        function getDetailedStats(m) {
            const sport = m.sportType;
            const id = (m.teams?.home?.id || 99);
            const pDom = 48 + (id % 15); const pExt = 25 + (id % 12); const pNul = (sport === 'FOOT') ? 100 - pDom - pExt : 0;
            let g = 0, threshold = 0, label = '';
            if (sport === 'FOOT') { g = (1.3 + (id % 3) * 0.7).toFixed(1); threshold = 1.5; label = 'Buts'; }
            else if (sport === 'RUGBY') { g = 38 + (id % 15); threshold = 45; label = 'Pts'; }
            else if (sport === 'BSK') { g = 185 + (id % 30); threshold = 210; label = 'Pts'; }
            else { g = 20; threshold = 30; label = 'Pts'; }

            let bestBet = '', fiabilite = Math.max(pDom, pExt), icon = '';
            if (sport === 'FOOT' && g >= threshold) { bestBet = 'OVER 1.5 BUTS'; fiabilite = 91; icon = '🔥'; }
            else if (sport === 'RUGBY' && g >= threshold) { bestBet = 'OVER 45.5 PTS'; fiabilite = 88; icon = '🔥'; }
            else { 
                bestBet = pDom > pExt ? 'VIC. DOMICILE' : 'VIC. EXTÉRIEUR'; 
                icon = sport === 'FOOT' ? '⚽' : (sport === 'RUGBY' ? '🏉' : '🏀');
            }
            return { pDom, pNul, pExt, g, threshold, label, bestBet, fiabilite, icon, sport };
        }

        function renderCard(m) {
            const s = getDetailedStats(m);
            const progression = Math.min((s.g / (s.threshold * 2)) * 100, 100);
            return `
            <div class="bg-white rounded-[2.5rem] overflow-hidden premium-shadow border border-white text-left mb-8">
                <div class="p-7 pb-2 flex justify-between items-center">
                    <span class="bg-cyan-500 text-white text-[9px] font-ultra px-4 py-1.5 rounded-full uppercase tracking-widest">${s.sport} | ${m.league.name}</span>
                    <span class="text-slate-300 text-[11px] font-ultra uppercase italic italic">Live Data</span>
                </div>
                <div class="px-8 py-5">
                    <h2 class="text-3xl font-ultra text-slate-900 uppercase tracking-tighter leading-[0.8]">${m.teams.home.name}</h2>
                    <h3 class="text-2xl font-ultra text-slate-200 uppercase tracking-tighter leading-[1.2]">${m.teams.away.name}</h3>
                </div>
                <div class="mx-7 bg-slate-50 rounded-[2rem] p-5 grid grid-cols-3 text-center border border-slate-100 mb-6">
                    <div class="border-r border-slate-200"><p class="text-[9px] font-bold text-slate-400 uppercase mb-1">1</p><p class="text-xl font-ultra text-slate-800">${s.pDom}%</p></div>
                    <div class="border-r border-slate-200"><p class="text-[9px] font-bold text-slate-400 uppercase mb-1">N</p><p class="text-xl font-ultra text-slate-300">${s.sport === 'FOOT' ? s.pNul+'%' : '-'}</p></div>
                    <div><p class="text-[9px] font-bold text-slate-400 uppercase mb-1">2</p><p class="text-xl font-ultra text-slate-800">${s.pExt}%</p></div>
                </div>
                <div class="px-8 py-2 relative">
                    <div class="flex justify-between items-center mb-3 text-[10px] font-ultra uppercase"><span class="text-slate-400 tracking-widest italic">IA Flux Scoring</span><span class="text-orange-500">${s.g} ${s.label}</span></div>
                    <div class="h-4 w-full bg-slate-100 rounded-full relative overflow-hidden border border-slate-200/50">
                        <div class="h-full bg-gradient-to-r from-orange-500 to-green-500" style="width: ${progression}%"></div>
                        <div class="absolute top-0 bottom-0 w-[4px] bg-black" style="left: 50%"></div>
                    </div>
                </div>
                <div class="bg-[#0f172a] p-7 flex justify-between items-center mt-6">
                    <div><p class="text-emerald-400 text-[9px] font-ultra uppercase tracking-widest mb-1 italic">${s.fiabilite}% CONFIANCE</p><p class="text-white text-xl font-ultra uppercase tracking-tighter">${s.icon} ${s.bestBet}</p></div>
                    <button class="bg-[#ff5100] text-white text-[10px] font-ultra px-6 py-4 rounded-2xl uppercase tracking-tighter">PARTAGER</button>
                </div>
            </div>`;
        }

        function render() {
            const container = document.getElementById('container'); container.innerHTML = "";
            let list = (current === 'top') ? [...DATA.foot, ...DATA.rugby].slice(0,5) : DATA[current];
            if(list && list.length > 0) {
                list.forEach(m => container.innerHTML += renderCard(m));
                document.getElementById('counter').innerText = list.length + " ANALYSES PRÊTES";
            } else { container.innerHTML = `<div class="py-20 text-center text-slate-300 font-ultra uppercase opacity-30 italic">Scan des matchs...</div>`; }
        }

        async function init() {
            document.getElementById('refresh-btn').classList.add('refresh-spin');
            await Promise.all([
                fetchSport('foot', "v3.football.api-sports.io", `https://v3.football.api-sports.io/fixtures?date=${today}&status=NS`),
                fetchSport('rugby', "v1.rugby.api-sports.io", `https://v1.rugby.api-sports.io/games?date=${today}`),
                fetchSport('ten', "v1.tennis.api-sports.io", `https://v1.tennis.api-sports.io/games?date=${today}`),
                fetchSport('bsk', "v1.basketball.api-sports.io", `https://v1.basketball.api-sports.io/games?date=${today}`)
            ]);
            document.getElementById('refresh-btn').classList.remove('refresh-spin');
        }
    </script>
</body>
</html>
