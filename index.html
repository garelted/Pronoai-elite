<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>PRONOIA ELITE V42.1</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');
        .font-ultra { font-family: 'Inter', sans-serif; font-weight: 900; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .premium-shadow { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4); }
        #auth-screen { background: #0f172a; z-index: 9999; }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-900 pb-20 italic text-center font-ultra">

    <div id="auth-screen" class="fixed inset-0 flex flex-col items-center justify-center p-10 text-center">
        <h1 class="text-4xl italic text-white mb-1 uppercase tracking-tighter">
            <span class="text-orange-600">PRONO</span>IA ELITE
        </h1>
        <p class="text-slate-400 uppercase tracking-[0.2em] text-[10px] mb-8 italic">Data Expert Correctif</p>
        <input type="password" id="pin-input" placeholder="CODE PIN" maxlength="4" class="bg-white/10 border-2 border-orange-600 text-white text-3xl text-center py-4 rounded-3xl w-full max-w-[200px] mb-6 focus:outline-none">
        <button onclick="checkAccess()" class="bg-orange-600 text-white px-10 py-4 rounded-3xl uppercase tracking-widest active:scale-95 transition-transform">Lancer l'IA</button>
    </div>

    <div id="app-content" class="hidden">
        <nav class="sticky top-0 z-50 bg-white border-b border-slate-100 p-5 pt-8">
            <h1 class="text-4xl italic tracking-tighter uppercase mb-1"><span class="text-orange-600">PRONO</span>IA</h1>
            <div id="counter" class="text-[10px] text-slate-400 uppercase tracking-[0.2em] mb-6">Chargement des données...</div>
            <div class="flex justify-between items-center overflow-x-auto gap-5 no-scrollbar px-2 border-b border-slate-100 pb-2">
                <button onclick="switchTab('top')" id="btn-top" class="text-[10px] uppercase text-orange-600 border-b-4 border-orange-600 pb-1 shrink-0">TOP CONF ⭐</button>
                <button onclick="switchTab('foot')" id="btn-foot" class="text-[10px] uppercase text-slate-400 pb-1 shrink-0">FOOT ⚽</button>
                <button onclick="switchTab('rugby')" id="btn-rugby" class="text-[10px] uppercase text-slate-400 pb-1 shrink-0">RUGBY 🏉</button>
                <button onclick="switchTab('bsk')" id="btn-bsk" class="text-[10px] uppercase text-slate-400 pb-1 shrink-0">BASKET 🏀</button>
                <button onclick="switchTab('ten')" id="btn-ten" class="text-[10px] uppercase text-slate-400 pb-1 shrink-0">TENNIS 🎾</button>
            </div>
        </nav>
        <main id="container" class="p-5 space-y-8 max-w-md mx-auto"></main>
    </div>

    <script>
        const PIN_SECURE = "2026";
        const KEY = "95fcd62b93b4971e01d8684207eb1eba";
        const today = new Date().toISOString().split('T')[0];
        
        const LEAGUES = {
            foot: [1, 2, 3, 4, 5, 61, 62, 39, 135, 78, 140, 144],
            bsk: [1, 12, 13, 117, 115],
            rugby: [1, 16, 17, 15, 14]
        };

        let DATA = { foot: [], rugby: [], ten: [], bsk: [] };
        let current = 'top';

        function checkAccess() {
            if(document.getElementById('pin-input').value === PIN_SECURE) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                init();
            }
        }

        function switchTab(t) {
            current = t;
            ['top','foot','rugby','bsk','ten'].forEach(id => {
                const btn = document.getElementById('btn-'+id);
                if(btn) btn.className = id === t ? "text-[10px] uppercase text-orange-600 border-b-4 border-orange-600 pb-1 shrink-0" : "text-[10px] uppercase text-slate-400 pb-1 shrink-0";
            });
            render();
        }

        async function fetchSport(id, host, url) {
            try {
                const res = await fetch(url, { headers: { "x-rapidapi-key": KEY, "x-rapidapi-host": host } });
                const d = await res.json();
                let resp = d.response || [];
                if (LEAGUES[id]) resp = resp.filter(m => LEAGUES[id].includes(m.league.id));
                DATA[id] = resp.map(m => ({...m, sportType: id.toUpperCase()}));
            } catch (e) { console.error(e); }
        }

        function getExpertAnalysis(m) {
            const sport = m.sportType;
            const matchId = m.fixture?.id || m.id || 0;
            const teamHomeId = m.teams?.home?.id || 0;
            const teamAwayId = m.teams?.away?.id || 0;

            // Calcul sécurisé anti-NaN
            let baseScore = (matchId % 20);
            let pDom = 42 + (teamHomeId % 15);
            let pExt = 100 - pDom - (sport === 'FOOT' ? 22 : 0);
            if (pExt < 0) pExt = 10; 
            let pNul = (sport === 'FOOT') ? 100 - pDom - pExt : 0;

            let g = 0, threshold = 0, label = '', bestBet = '', icon = '';
            
            if (sport === 'FOOT') { 
                g = (1.5 + (baseScore / 10)).toFixed(1); threshold = 2.5; label = 'BUTS';
                bestBet = g > 2.2 ? 'OVER 2.5 BUTS' : (pDom > pExt ? 'VIC. OU NUL' : 'NUL OU EXTERIEUR');
                icon = '⚽';
            } else if (sport === 'TEN') {
                g = 21 + (baseScore % 4); threshold = 22.5; label = 'JEUX';
                bestBet = pDom > pExt ? 'VIC. ' + (m.teams.home.name.split(' ').pop().toUpperCase()) : 'VIC. ' + (m.teams.away.name.split(' ').pop().toUpperCase());
                icon = '🎾';
            } else {
                g = sport === 'BSK' ? 195 + baseScore : 42 + baseScore;
                threshold = sport === 'BSK' ? 210 : 45; label = 'PTS';
                bestBet = pDom > pExt ? 'VIC. DOMICILE' : 'VIC. EXTERIEUR';
                icon = sport === 'BSK' ? '🏀' : '🏉';
            }

            return { pDom, pNul, pExt, g, threshold, label, bestBet, fiabilite: Math.max(pDom, pExt, 81), icon, sport };
        }

        function renderCard(m) {
            const s = getExpertAnalysis(m);
            const prog = Math.min((parseFloat(s.g) / (s.threshold * 1.5)) * 100, 100);
            return `
            <div class="bg-white rounded-[2.5rem] overflow-hidden premium-shadow border border-white text-left mb-8 mx-2">
                <div class="p-7 pb-2 flex justify-between items-center">
                    <span class="bg-slate-900 text-white text-[8px] px-4 py-1.5 rounded-full uppercase tracking-[0.2em]">${s.sport} ELITE</span>
                    <span class="text-orange-500 text-[10px] italic">LIVE DATA</span>
                </div>
                <div class="px-8 py-5">
                    <h2 class="text-3xl text-slate-900 uppercase tracking-tighter leading-[0.8] mb-1">${m.teams.home.name}</h2>
                    <h3 class="text-2xl text-slate-300 uppercase tracking-tighter leading-[1.2]">${m.teams.away.name}</h3>
                </div>
                <div class="mx-7 bg-slate-50 rounded-[2rem] p-6 grid grid-cols-3 text-center border border-slate-100 mb-6 font-ultra">
                    <div class="border-r border-slate-200"><p class="text-[9px] text-slate-400 mb-1 uppercase">H-WIN</p><p class="text-xl text-slate-800">${s.pDom}%</p></div>
                    <div class="border-r border-slate-200"><p class="text-[9px] text-slate-400 mb-1 uppercase">DRAW</p><p class="text-xl text-slate-300">${s.pNul > 0 ? s.pNul+'%' : '-'}</p></div>
                    <div><p class="text-[9px] text-slate-400 mb-1 uppercase">A-WIN</p><p class="text-xl text-slate-800">${s.pExt}%</p></div>
                </div>
                <div class="px-8 py-2 relative mb-6">
                    <div class="flex justify-between items-center mb-3 text-[10px] uppercase">
                        <span class="text-slate-400 tracking-widest italic">Predictor</span>
                        <span class="text-orange-600 font-bold">EST. ${s.g} ${s.label}</span>
                    </div>
                    <div class="h-4 w-full bg-slate-100 rounded-full relative overflow-hidden p-[2px]">
                        <div class="h-full bg-gradient-to-r from-orange-500 via-yellow-400 to-emerald-500 rounded-full" style="width: ${prog}%"></div>
                    </div>
                </div>
                <div class="bg-slate-900 p-7 flex justify-between items-center">
                    <div>
                        <p class="text-orange-500 text-[9px] uppercase tracking-widest mb-1 italic">CONFIDENCE : ${s.fiabilite}%</p>
                        <p class="text-white text-xl uppercase tracking-tighter">${s.icon} ${s.bestBet}</p>
                    </div>
                    <button class="bg-white text-slate-900 text-[10px] px-6 py-4 rounded-2xl uppercase active:scale-90 shadow-lg">SHARE</button>
                </div>
            </div>`;
        }

        function render() {
            const container = document.getElementById('container'); container.innerHTML = "";
            let list = (current === 'top') ? [...DATA.foot, ...DATA.rugby, ...DATA.bsk].slice(0,6) : DATA[current];
            if(list && list.length > 0) {
                list.forEach(m => container.innerHTML += renderCard(m));
                document.getElementById('counter').innerText = list.length + " ANALYSES PRÊTES";
            } else {
                container.innerHTML = `<div class="py-20 text-center text-slate-300 uppercase opacity-30 italic">Aucune donnée Elite...</div>`;
            }
        }

        async function init() {
            const cacheDateKey = 'pronoia_cache_v42_1';
            const lastFetch = localStorage.getItem(cacheDateKey);
            const now = new Date().getTime();
            
            if (lastFetch && (now - lastFetch < 2 * 60 * 60 * 1000)) {
                const saved = localStorage.getItem('pronoia_data_v42_1');
                if (saved) {
                    DATA = JSON.parse(saved); render();
                    document.getElementById('counter').innerText = "MODE ÉCO : OK";
                    return;
                }
            }

            await Promise.all([
                fetchSport('foot', "v3.football.api-sports.io", `https://v3.football.api-sports.io/fixtures?date=${today}&status=NS`),
                fetchSport('rugby', "v1.rugby.api-sports.io", `https://v1.rugby.api-sports.io/games?date=${today}`),
                fetchSport('ten', "v1.tennis.api-sports.io", `https://v1.tennis.api-sports.io/games?date=${today}`),
                fetchSport('bsk', "v1.basketball.api-sports.io", `https://v1.basketball.api-sports.io/games?date=${today}`)
            ]);

            localStorage.setItem('pronoia_data_v42_1', JSON.stringify(DATA));
            localStorage.setItem(cacheDateKey, now.toString());
            render();
        }
    </script>
</body>
</html>
