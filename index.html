<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>PRONOIA V61 - ULTIMATE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');
        .font-ultra { font-family: 'Inter', sans-serif; font-weight: 900; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .tab-active { color: #ea580c; border-bottom: 4px solid #ea580c; }
        @keyframes pulse-red { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .animate-live { animation: pulse-red 2s infinite; }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-900 pb-24 italic font-ultra">

    <div id="auth-screen" class="fixed inset-0 flex flex-col items-center justify-center p-10 text-center bg-[#0f172a] z-[100]">
        <h1 class="text-5xl text-white mb-2 uppercase tracking-tighter italic"><span class="text-orange-600">PRONO</span>IA</h1>
        <p class="text-slate-500 uppercase tracking-widest text-[10px] mb-8 italic">Ultimate Edition V61</p>
        <input type="password" id="pin-input" placeholder="PIN" maxlength="4" class="bg-white/10 border-2 border-orange-600 text-white text-4xl text-center py-5 rounded-[2rem] w-full max-w-[200px] mb-8 focus:outline-none">
        <button onclick="checkAccess()" class="bg-orange-600 text-white px-10 py-4 rounded-3xl uppercase tracking-widest active:scale-95 transition">Analyser</button>
    </div>

    <div id="app-content" class="hidden">
        <nav class="sticky top-0 z-50 bg-white border-b p-6 pt-10 text-center">
            <h1 class="text-4xl tracking-tighter uppercase mb-6 italic"><span class="text-orange-600">PRONO</span>IA</h1>
            <div class="flex justify-between items-center overflow-x-auto gap-5 no-scrollbar px-2">
                <button onclick="switchTab('top')" id="btn-top" class="text-[11px] uppercase pb-1 tab-active font-black">CONSENSUS ⭐</button>
                <button onclick="switchTab('foot')" id="btn-foot" class="text-[11px] uppercase text-slate-400 pb-1 font-black">FOOTBALL ⚽</button>
                <button onclick="switchTab('bsk')" id="btn-bsk" class="text-[11px] uppercase text-slate-400 pb-1 font-black">BASKET 🏀</button>
                <button onclick="switchTab('rugby')" id="btn-rugby" class="text-[11px] uppercase text-slate-400 pb-1 font-black">RUGBY 🏉</button>
            </div>
        </nav>
        <main id="container" class="p-5 space-y-6 max-w-md mx-auto"></main>
    </div>

    <script>
        const PIN_SECURE = "2026";
        const KEY = "95fcd62b93b4971e01d8684207eb1eba";
        const today = new Date().toISOString().split('T')[0];
        const ELITE_LEAGUES = [61, 39, 140, 78, 135, 12, 13, 16, 15, 1, 2, 3]; 

        let DATA = { foot: [], bsk: [], rugby: [], standings: {} };
        let current = 'top';

        function checkAccess() {
            if(document.getElementById('pin-input').value === PIN_SECURE) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                init();
            }
        }

        function switchTab(t) {
            current = t;
            ['top','foot','bsk','rugby'].forEach(id => {
                const btn = document.getElementById('btn-'+id);
                if(btn) btn.className = id === t ? "text-[11px] uppercase pb-1 tab-active font-black" : "text-[11px] uppercase text-slate-400 pb-1 font-black";
            });
            render();
        }

        // --- MOTEUR HYBRIDE (DESIGN V59 + LOGIQUE V60) ---
        function getUltimateStats(m, sport) {
            const combinedStr = (m.teams.home.name + m.teams.away.name);
            let hash = 0;
            for (let i = 0; i < combinedStr.length; i++) hash = combinedStr.charCodeAt(i) + ((hash << 5) - hash);
            const seed = Math.abs(hash);

            // Bases
            let pDom = 38 + (seed % 20);
            let pExt = 92 - pDom - (sport === 'FOOT' ? 12 : 0);

            // CROISEMENT RÉEL (Si dispo)
            if (sport === 'FOOT' && DATA.standings[m.league?.id]) {
                const league = DATA.standings[m.league.id];
                const hS = league.find(t => t.team.id === m.teams.home.id);
                const aS = league.find(t => t.team.id === m.teams.away.id);
                if (hS && aS) {
                    pDom += (aS.rank - hS.rank) * 1.2;
                    const hF = (hS.form || "").split('').filter(c => c === 'W').length;
                    const aF = (aS.form || "").split('').filter(c => c === 'W').length;
                    pDom += (hF * 2); pExt += (aF * 2);
                }
            }

            const total = pDom + pExt + (sport === 'FOOT' ? 15 : 0);
            pDom = Math.floor((pDom/total)*100);
            pExt = Math.floor((pExt/total)*100);
            const pNul = 100 - pDom - pExt;

            // Estimation Score (Retour du bandeau orange)
            let scoreLabel, scoreProb;
            if (sport === 'BSK') {
                scoreLabel = (205 + (seed % 25)) + " PTS TOTAL";
                scoreProb = 72 + (seed % 10);
            } else if (sport === 'FOOT') {
                const gSeed = seed % 100;
                if (gSeed < 25) scoreLabel = "0-1 BUTS";
                else if (gSeed < 65) scoreLabel = "1-2 BUTS";
                else if (gSeed < 88) scoreLabel = "2-3 BUTS";
                else scoreLabel = "3+ BUTS";
                scoreProb = 64 + (seed % 10);
            } else {
                scoreLabel = (35 + (seed % 20)) + " PTS TOTAL";
                scoreProb = 60;
            }

            return { pDom, pNul, pExt, scoreLabel, scoreProb, trust: Math.min(Math.max(pDom, pExt) + 12, 98), advice: pDom > pExt ? 'VICTOIRE DOMICILE' : 'VICTOIRE EXTÉRIEURE' };
        }

        function renderCard(m, sport) {
            const res = getUltimateStats(m, sport);
            return `
            <div class="bg-white rounded-[2.5rem] shadow-2xl mb-8 overflow-hidden border border-slate-50 relative">
                <div class="px-8 pt-8 pb-2 flex justify-between items-center">
                    <p class="text-[10px] text-slate-400 uppercase tracking-widest font-black italic">${m.league?.name || 'ELITE'}</p>
                    <div class="flex items-center gap-1.5">
                        <div class="w-2 h-2 bg-red-500 rounded-full animate-live"></div>
                        <span class="text-slate-900 text-[9px] font-black uppercase italic">Deep Sync</span>
                    </div>
                </div>
                
                <div class="px-8 py-4 space-y-3">
                    <div class="flex items-center gap-3">
                        <img src="${m.teams.home.logo}" class="w-10 h-10 rounded-full shadow-sm">
                        <h2 class="text-3xl text-slate-900 uppercase tracking-tighter leading-[0.8] font-black flex-1">${m.teams.home.name}</h2>
                    </div>
                    <div class="flex items-center gap-3">
                        <img src="${m.teams.away.logo}" class="w-10 h-10 rounded-full shadow-sm">
                        <h3 class="text-2xl text-slate-300 uppercase tracking-tighter leading-[1.2] font-black flex-1">${m.teams.away.name}</h3>
                    </div>
                </div>

                <div class="mx-6 my-4 bg-slate-50 rounded-[2rem] p-6 flex justify-around items-center border border-slate-100">
                    <div class="text-center"><p class="text-[9px] text-slate-400 uppercase mb-1 font-black">1</p><p class="text-2xl font-black">${res.pDom}%</p></div>
                    ${res.pNul > 0 ? `<div class="h-8 w-[1px] bg-slate-200"></div><div class="text-center"><p class="text-[9px] text-slate-400 uppercase mb-1 font-black">N</p><p class="text-2xl text-slate-300 font-black">${res.pNul}%</p></div>` : ''}
                    <div class="h-8 w-[1px] bg-slate-200"></div>
                    <div class="text-center"><p class="text-[9px] text-slate-400 uppercase mb-1 font-black">2</p><p class="text-2xl font-black">${res.pExt}%</p></div>
                </div>

                <div class="mx-8 mb-6 py-5 px-6 bg-orange-600 rounded-[1.8rem] text-white flex justify-between items-center shadow-lg shadow-orange-200">
                    <div>
                        <p class="text-[9px] uppercase tracking-widest opacity-80 mb-1 font-black italic">Estimation Score</p>
                        <p class="text-lg uppercase leading-none italic font-black">${res.scoreLabel}</p>
                    </div>
                    <p class="text-2xl font-black italic">${res.scoreProb}%</p>
                </div>

                <div class="px-8 mb-8">
                    <div class="h-3.5 w-full bg-slate-100 rounded-full relative overflow-hidden">
                        <div class="h-full bg-gradient-to-r from-orange-500 to-emerald-500" style="width: ${res.trust}%"></div>
                    </div>
                    <div class="flex justify-between text-[9px] uppercase mt-2 tracking-widest text-slate-400 font-black italic">
                        <span>Fiabilité IA</span>
                        <span>${res.trust}%</span>
                    </div>
                </div>

                <div class="bg-slate-900 p-7 flex justify-between items-center text-white">
                    <div>
                        <p class="text-emerald-400 text-[10px] uppercase tracking-widest mb-1 italic font-black">Conseil Pronoia</p>
                        <p class="text-xl uppercase tracking-tighter italic font-black">${res.advice}</p>
                    </div>
                    <div class="bg-white/10 px-4 py-2 rounded-xl text-[10px] uppercase font-black">Details</div>
                </div>
            </div>`;
        }

        function render() {
            const container = document.getElementById('container');
            container.innerHTML = "";
            if (current === 'top') {
                DATA.foot.slice(0,5).forEach(m => container.innerHTML += renderCard(m, 'FOOT'));
                DATA.bsk.slice(0,3).forEach(m => container.innerHTML += renderCard(m, 'BSK'));
            } else {
                DATA[current].forEach(m => container.innerHTML += renderCard(m, current.toUpperCase()));
            }
        }

        async function fetchSport(id, host, endpoint) {
            try {
                const res = await fetch(`https://${host}/${endpoint}`, { headers: { "x-rapidapi-key": KEY, "x-rapidapi-host": host } });
                const d = await res.json();
                if (id === 'standings') {
                    const lId = endpoint.match(/league=(\d+)/)[1];
                    DATA.standings[lId] = d.response[0]?.league?.standings[0];
                } else {
                    DATA[id] = (d.response || []).filter(m => ELITE_LEAGUES.includes(m.league?.id));
                }
            } catch (e) { console.log(id + " Error"); }
        }

        async function init() {
            const cacheKey = 'pronoia_v61_data';
            const cacheTimeKey = 'pronoia_v61_time';
            const now = new Date().getTime();

            if (localStorage.getItem(cacheKey) && (now - localStorage.getItem(cacheTimeKey) < 7200000)) {
                DATA = JSON.parse(localStorage.getItem(cacheKey));
                render();
            } else {
                await Promise.all([
                    fetchSport('foot', "v3.football.api-sports.io", `fixtures?date=${today}&status=NS`),
                    fetchSport('bsk', "v1.basketball.api-sports.io", `games?date=${today}`),
                    fetchSport('rugby', "v1.rugby.api-sports.io", `games?date=${today}`)
                ]);
                const leagues = [...new Set(DATA.foot.map(m => m.league.id))];
                for (let lId of leagues) await fetchSport('standings', "v3.football.api-sports.io", `standings?league=${lId}&season=2025`);
                
                localStorage.setItem(cacheKey, JSON.stringify(DATA));
                localStorage.setItem(cacheTimeKey, now.toString());
                render();
            }
        }
    </script>
</body>
</html>
